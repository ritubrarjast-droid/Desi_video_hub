<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desi Video Hub</title>
<style>
body{margin:0;background:#101014;color:#fff;font-family:Arial,sans-serif}
header{padding:28px 15px;text-align:center;background:linear-gradient(135deg,#ff3d00,#ff0055)}
h1{margin:0;font-size:30px}.wrap{max-width:1000px;margin:auto;padding:18px}
input{width:100%;padding:14px;border:0;border-radius:10px;margin:10px 0 20px;font-size:16px;box-sizing:border-box}
.tabs{text-align:center;margin-bottom:18px}button{padding:10px 18px;border:0;border-radius:20px;margin:4px;background:#333;color:#fff}button.active{background:#ff3d00}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#1d1d22;border-radius:12px;overflow:hidden}.card video,.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.info{padding:12px}.info h3{margin:0 0 10px}.download{background:#ff3d00;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;display:inline-block}
.note{margin-top:22px;padding:15px;background:#1b1b20;border-radius:10px;color:#bbb}
footer{text-align:center;padding:30px;color:#888}
</style>
</head>
<body>
<header><h1>🔥 Desi Video Hub</h1><p>Photo & Video Gallery</p></header>
<div class="wrap">
<div class="tabs">
<button class="active" onclick="tab('v',this)">🎬 Videos</button>
<button onclick="tab('p',this)">🖼️ Photos</button>
</div>
<input id="search" placeholder="🔎 Search..." oninput="search()">
<section id="v" class="grid">
<div class="card" data-name="Demo Video 1"><video controls><source src="video1.mp4" type="video/mp4"></video><div class="info"><h3>Demo Video 1</h3><a class="download" href="video1.mp4" download>📥 Download</a></div></div>
<div class="card" data-name="Demo Video 2"><video controls><source src="video2.mp4" type="video/mp4"></video><div class="info"><h3>Demo Video 2</h3><a class="download" href="video2.mp4" download>📥 Download</a></div></div>
</section>
<section id="p" class="grid" style="display:none">
<div class="card" data-name="Demo Photo 1"><img src="photo1.jpg"><div class="info"><h3>Demo Photo 1</h3><a class="download" href="photo1.jpg" download>📥 Download</a></div></div>
<div class="card" data-name="Demo Photo 2"><img src="photo2.jpg"><div class="info"><h3>Demo Photo 2</h3><a class="download" href="photo2.jpg" download>📥 Download</a></div></div>
</section>
<div class="note">अपनी फोटो/वीडियो इसी folder में रखें और code में उनके नाम बदल दें।</div>
</div><footer>© 2026 Desi Video Hub</footer>
<script>
function tab(id,b){v.style.display=id==='v'?'grid':'none';p.style.display=id==='p'?'grid':'none';document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');search()}
function search(){let q=document.getElementById('search').value.toLowerCase();let s=v.style.display!=='none'?v:p;s.querySelectorAll('.card').forEach(c=>c.style.display=c.dataset.name.toLowerCase().includes(q)?'block':'none')}
</script>
</body></html>
